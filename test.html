<!DOCTYPE html>
<html>
<head><title>Upload Test</title></head>
<body style="background:#111;color:white;font-family:sans-serif;padding:40px;">
    <h1>TwinMed Upload Test</h1>
    <p>If you can see this page, the server is working.</p>
    <hr>
    <h2>Test 1: Native File Input</h2>
    <input type="file" id="test1" multiple accept="image/*" style="font-size:18px;color:white;">
    <hr>
    <h2>Test 2: Button that triggers file input</h2>
    <button onclick="document.getElementById('test2').click()" style="font-size:18px;padding:10px 20px;">Click Me To Browse</button>
    <input type="file" id="test2" multiple style="display:none;">
    <hr>
    <div id="result" style="margin-top:20px;padding:20px;background:#222;border-radius:8px;">
        No files selected yet...
    </div>
    <script>
        document.getElementById('test1').addEventListener('change', function(e) {
            document.getElementById('result').innerText = 'TEST 1 WORKS! Selected ' + e.target.files.length + ' files.';
            document.getElementById('result').style.color = '#00ff00';
        });
        document.getElementById('test2').addEventListener('change', function(e) {
            document.getElementById('result').innerText = 'TEST 2 WORKS! Selected ' + e.target.files.length + ' files.';
            document.getElementById('result').style.color = '#00ff00';
        });
    </script>
</body>
</html>
